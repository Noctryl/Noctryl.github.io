<div class="footer">
  <section class="newsletter-signup" aria-labelledby="newsletter-title">
    <h3 id="newsletter-title">Letters, occasionally.</h3>
    <p>New writing from The Quiet Collapse, delivered to your inbox.</p>
    <form class="newsletter-form" novalidate>
      <label class="newsletter-label" for="newsletter-email">Email address</label>
      <div class="newsletter-controls">
        <input id="newsletter-email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        <button type="submit">Subscribe</button>
      </div>
    </form>
    <p class="newsletter-note">No noise. Just new writing, when there's something to share.</p>
    <p class="newsletter-feedback" role="status" aria-live="polite" hidden></p>
  </section>
  <div class="footer-dots">
    <img src="/footers.png" alt="footer">
  </div>
  <br>
  <p>Made with ❤️ and <a href="https://github.com/mangeshrex/akhbaar">अखबार!</a></p>
  <p><a href="{{ "index.xml" | relURL }}">RSS</a></p>
</div>

<style>
.newsletter-signup {
  max-width: 560px;
  margin: 0 auto 1.5rem;
  padding: 0 1rem;
  color: inherit;
  text-align: center;
}
.newsletter-signup h3 {
  margin: 0 0 .35rem;
  font: inherit;
  font-size: 1.35rem;
  color: inherit;
}
.newsletter-signup > p {
  margin: 0 0 .9rem;
  font-size: .95rem;
}
.newsletter-form { margin: 0; }
.newsletter-label {
  display: block;
  margin-bottom: .35rem;
  text-align: left;
  font-size: .9rem;
}
.newsletter-controls {
  display: flex;
  gap: .5rem;
}
.newsletter-controls input[type="email"] {
  min-width: 0;
  flex: 1;
  padding: .65rem .8rem;
  border: 1px solid currentColor;
  border-radius: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 1rem;
}
.newsletter-controls input[type="email"]::placeholder { color: inherit; opacity: .6; }
.newsletter-controls button {
  padding: .65rem 1rem;
  border: 1px solid currentColor;
  border-radius: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 1rem;
  cursor: pointer;
}
.newsletter-controls button:hover { background: currentColor; color: var(--newsletter-bg, #f5f2e8); }
 .newsletter-note { margin-top: .6rem !important; font-size: .82rem !important; opacity: .65; }
.newsletter-feedback { margin: .7rem 0 0; font-size: .9rem; }
.newsletter-feedback[data-state="error"] { opacity: .9; }
.newsletter-feedback[data-state="success"] { opacity: .85; }
.newsletter-controls button:disabled { opacity: .55; cursor: wait; }
@media (max-width: 420px) {
  .newsletter-controls { flex-direction: column; }
  .newsletter-controls button { width: 100%; }
}
</style>

<script>
  if (window.feather) feather.replace();
  (() => {
    const form = document.querySelector(".newsletter-form");
    if (!form) return;
    const emailInput = form.querySelector('input[name="email"]');
    const button = form.querySelector('button[type="submit"]');
    const feedback = form.parentElement.querySelector(".newsletter-feedback");
    const workerURL = "https://white-haze-f676.okand7946.workers.dev/";

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = emailInput.value.trim();
      if (!emailInput.checkValidity()) {
        emailInput.reportValidity();
        return;
      }
      feedback.hidden = false;
      feedback.textContent = "Sending your request…";
      button.disabled = true;
      try {
        const response = await fetch(workerURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        const result = await response.json();
        feedback.textContent = result.message || "Request processed.";
        feedback.dataset.state = response.ok ? "success" : "error";
        if (response.ok) form.reset();
      } catch (_) {
        feedback.textContent = "Connection failed. Please try again.";
        feedback.dataset.state = "error";
      } finally {
        button.disabled = false;
      }
    });
  })();
</script>
