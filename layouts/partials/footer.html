<div class="footer">
  <section class="newsletter-signup" aria-labelledby="newsletter-title">
    <h3 id="newsletter-title">Letters, occasionally.</h3>
    <p>New writing from The Quiet Collapse, delivered to your inbox.</p>

    <!-- follow.it response loads here so the reader stays on this page -->
    <iframe
      name="followit-newsletter-frame"
      id="followit-newsletter-frame"
      title="Newsletter subscription response"
      class="newsletter-hidden-frame"
      aria-hidden="true"
      tabindex="-1"
    ></iframe>

    <form
      action="https://api.follow.it/subscription-form/SDdFQkgzYWlTL2trS3JoUlFOOThib2dMWmlGcTdzVUNTSkZUamcrVmptcFRYaXFIYXRGeFBXWTc4aTk0eDNXVmxnRHZZUGtqRk5ZVk9NOG5MZzhKcW1rRkp4aW1BNDN1MUUzdDB3VjBqeldmQ3NkT3RQWjRNVUtHbGdsT1phT2J8bUVHYkpsd1lDTnVHb0IxSVA5eHM2YmUwUDhpSjNTV2dDc0dzRXlTbGIyWT0=/8"
      method="post"
      target="followit-newsletter-frame"
      class="newsletter-form"
      id="newsletter-form"
    >
      <label class="newsletter-label" for="newsletter-email">Email address</label>
      <div class="newsletter-controls">
        <input
          id="newsletter-email"
          type="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
        <button type="submit" id="newsletter-submit">Subscribe</button>
      </div>
      <p id="newsletter-message" role="status" aria-live="polite" hidden></p>
    </form>
    <p class="newsletter-note">You'll receive a confirmation email to complete your subscription.</p>
  </section>

  <div class="footer-dots">
    <img src="/footers.png" alt="footer">
  </div>
  <br>
  <p>
  Made with ❤️ and <a href="https://github.com/mangeshrex/akhbaar">अखबार!</a>
  </p>
  <p><a href="{{ "index.xml" | relURL }}">RSS</a></p>
</div>

<style>
.newsletter-signup {
  max-width: 560px;
  margin: 0 auto 1.5rem;
  padding: 0 1rem;
  color: inherit;
  text-align: center;
}
.newsletter-signup h3 {
  margin: 0 0 .35rem;
  font: inherit;
  font-size: 1.35rem;
  color: inherit;
}
.newsletter-signup > p {
  margin: 0 0 .9rem;
  font-size: .95rem;
}
.newsletter-form { margin: 0; }
.newsletter-label {
  display: block;
  margin-bottom: .35rem;
  text-align: left;
  font-size: .9rem;
}
.newsletter-controls {
  display: flex;
  gap: .5rem;
}
.newsletter-controls input[type="email"] {
  min-width: 0;
  flex: 1;
  padding: .65rem .8rem;
  border: 1px solid currentColor;
  border-radius: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 1rem;
}
.newsletter-controls input[type="email"]::placeholder { color: inherit; opacity: .6; }
.newsletter-controls button {
  padding: .65rem 1rem;
  border: 1px solid currentColor;
  border-radius: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 1rem;
  cursor: pointer;
}
.newsletter-controls button:hover { background: currentColor; color: var(--newsletter-bg, #f5f2e8); }
.newsletter-controls button:disabled { opacity: .6; cursor: wait; }
.newsletter-hidden-frame {
  position: absolute;
  width: 1px;
  height: 1px;
  border: 0;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  overflow: hidden;
  white-space: nowrap;
}
.newsletter-note {
  margin-top: .55rem !important;
  font-size: .82rem !important;
  opacity: .75;
}
#newsletter-message { margin-top: .65rem; font-size: .9rem; }
@media (max-width: 420px) {
  .newsletter-controls { flex-direction: column; }
  .newsletter-controls button { width: 100%; }
}
</style>

<script>
(() => {
  const form = document.getElementById("newsletter-form");
  const iframe = document.getElementById("followit-newsletter-frame");
  if (!form || !iframe) return;

  const message = document.getElementById("newsletter-message");
  const button = document.getElementById("newsletter-submit");
  const email = document.getElementById("newsletter-email");
  let submitted = false;

  form.addEventListener("submit", () => {
    submitted = true;
    button.disabled = true;
    button.textContent = "Submitting…";
    message.hidden = false;
    message.textContent = "Submitting your subscription…";
  });

  iframe.addEventListener("load", () => {
    if (!submitted) return;
    submitted = false;
    button.disabled = false;
    button.textContent = "Subscribe";
    message.textContent = "Form submitted. Please check your inbox and confirm your subscription.";
    email.value = "";
  });
})();
feather.replace();
</script>
