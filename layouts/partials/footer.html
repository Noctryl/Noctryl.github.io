<div class="footer">
  <section class="newsletter-signup" aria-labelledby="newsletter-title">
    <h3 id="newsletter-title">Letters, occasionally.</h3>
    <p>New writing from The Quiet Collapse, delivered to your inbox.</p>
    <form action="https://api.follow.it/subscription-form/SDdFQkgzYWlTL2trS3JoUlFOOThib2dMWmlGcTdzVUNTSkZUamcrVmptcFRYaXFIYXRGeFBXWTc4aTk0eDNXVmxnRHZZUGtqRk5ZVk9NOG5MZzhKcW1rRkp4aW1BNDN1MUUzdDB3VjBqeldmQ3NkT3RQWjRNVUtHbGdsT1phT2J8bUVHYkpsd1lDTnVHb0IxSVA5eHM2YmUwUDhpSjNTV2dDc0dzRXlTbGIyWT0=/8" method="post" target="followit-response" class="newsletter-form">
      <label class="newsletter-label" for="newsletter-email">Email address</label>
      <div class="newsletter-controls">
        <input id="newsletter-email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        <button type="submit">Subscribe</button>
      </div>
    </form>
    <iframe name="followit-response" title="Subscription response" class="newsletter-response-frame"></iframe>
    <p class="newsletter-status" aria-live="polite"></p>
    <p class="newsletter-note">No noise. Just new writing, when there's something to share.</p>
  </section>
  <div class="footer-dots">
    <img src="/footers.png" alt="footer">
  </div>
  <br>
  <p>Made with ❤️ and <a href="https://github.com/mangeshrex/akhbaar">अखबार!</a></p>
  <p><a href="{{ "index.xml" | relURL }}">RSS</a></p>
</div>

<style>
.newsletter-signup {
  max-width: 560px;
  margin: 0 auto 1.5rem;
  padding: 0 1rem;
  color: inherit;
  text-align: center;
}
.newsletter-signup h3 {
  margin: 0 0 .35rem;
  font: inherit;
  font-size: 1.35rem;
  color: inherit;
}
.newsletter-signup > p {
  margin: 0 0 .9rem;
  font-size: .95rem;
}
.newsletter-form { margin: 0; }
.newsletter-label {
  display: block;
  margin-bottom: .35rem;
  text-align: left;
  font-size: .9rem;
}
.newsletter-controls {
  display: flex;
  gap: .5rem;
}
.newsletter-controls input[type="email"] {
  min-width: 0;
  flex: 1;
  padding: .65rem .8rem;
  border: 1px solid currentColor;
  border-radius: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 1rem;
}
.newsletter-controls input[type="email"]::placeholder { color: inherit; opacity: .6; }
.newsletter-controls button {
  padding: .65rem 1rem;
  border: 1px solid currentColor;
  border-radius: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 1rem;
  cursor: pointer;
}
.newsletter-controls button:hover { background: currentColor; color: var(--newsletter-bg, #f5f2e8); }
.newsletter-note { margin-top: .6rem !important; font-size: .82rem !important; opacity: .65; }
.newsletter-status { margin: .6rem 0 0 !important; font-size: .9rem !important; }
.newsletter-response-frame { position: absolute; width: 1px; height: 1px; border: 0; opacity: 0; pointer-events: none; }
@media (max-width: 420px) {
  .newsletter-controls { flex-direction: column; }
  .newsletter-controls button { width: 100%; }
}
</style>

<script>
(() => {
  const form = document.querySelector(".newsletter-form");
  const frame = document.querySelector('iframe[name="followit-response"]');
  const status = document.querySelector(".newsletter-status");
  const button = form?.querySelector('button[type="submit"]');
  let submitted = false;

  form?.addEventListener("submit", () => {
    submitted = true;
    if (button) button.textContent = "Sending…";
    if (status) status.textContent = "Sending your subscription to Follow.it…";
  });

  frame?.addEventListener("load", () => {
    if (!submitted) return;
    if (status) status.textContent = "Follow.it replied. Check your inbox for a confirmation email.";
    if (button) button.textContent = "Subscribe";
    submitted = false;
  });
})();
</script>
