name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Checkout Akhbaar theme
        uses: actions/checkout@v4
        with:
          repository: Noctryl/css-hugo-theming
          ref: a7de5be2784349072f6c88e7e4dada21c03b9d22
          path: themes/akhbaar

      - name: Install Hugo
        run: |
          HUGO_VERSION=0.150.1
          wget -O "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: |
          hugo --cleanDestinationDir --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Inject and verify follow.it ownership tag
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path("public/index.html")
          html = page.read_text(encoding="utf-8")
          tag = '<meta name="follow.it-verification-code" content="YAXMex1qqAnJlq5tjvzx">'
          if tag not in html:
              if "<head>" not in html:
                  raise SystemExit("Could not find <head> in public/index.html")
              html = html.replace("<head>", "<head>" + tag, 1)
              page.write_text(html, encoding="utf-8")
          if tag not in page.read_text(encoding="utf-8"):
              raise SystemExit("follow.it verification tag missing after injection")
          print("Verified follow.it meta tag in public/index.html")
          PY

      - name: Copy site root media into the build
        run: |
          for f in background.png footers.png bus.jpg; do
            if [ -f "$f" ]; then cp "$f" public/; fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
